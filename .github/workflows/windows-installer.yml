name: Windows Installer

on:
  push:
    branches: [main, "arena/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Automated tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      - name: Live API verification (read-only, official endpoints)
        run: npm run test:live
        continue-on-error: true

  windows-installer:
    name: Build UniversalGameAssetHub-Setup.exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:win
        env:
          # Keep unsigned builds working; set these secrets for signed releases.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalGameAssetHub-Windows-Installer
          path: |
            dist/UniversalGameAssetHub-Setup.exe
            dist/UniversalGameAssetHub-Portable.exe
          if-no-files-found: error
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UniversalGameAssetHub-Setup.exe
            dist/UniversalGameAssetHub-Portable.exe
